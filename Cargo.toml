[package]
name = "BetterStreamer"
version = "0.1.0"
edition = "2024"

[lib]
name = "better_streamer"
path = "src/lib.rs"

[[bin]]
name = "betterstreamer"
path = "src/main.rs"

[dependencies]
# Pinned to versions available in the local cargo cache so Phase 0 builds offline.
# `csv` intentionally deferred to Phase 6 (network.rs uses a std-only parser for now).
anyhow = "=1.0.102"
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.19"
